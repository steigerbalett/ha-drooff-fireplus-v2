blueprint:
  name: "Drooff fire+: Holz nachlegen / Add wood"
  description: |-
    Erinnert, wenn der fire+ nach Holz verlangt. Für "Holz nachlegen" und "Dringend Holz nachlegen" lassen sich getrennte Aktionen einstellen: Nachrichten (Pushover, Telegram, Handy-App und andere Notify-Aktionen), Ansagen auf Amazon-Echo-Geräten und weitere Aktionen. Alle Kanäle sind optional und haben eine eigene Verzögerung. Ein Kanal meldet sich nur, wenn der Zustand nach der Verzögerung noch besteht. Standardmäßig meldet sich nur "Dringend Holz nachlegen", "Holz nachlegen" lässt sich dazuschalten. Solange die Aktionen für "Dringend" nicht eingeschaltet sind, gelten dort die Aktionen für "Holz nachlegen". Außerdem warnt er, wenn die Tür zu lange offen ist oder der Schornstein zu wenig Zug hat. Die Sprache bestimmt die Standardtexte.

    <small>**English:** Reminds you when the fire+ asks for wood. "Wood required" and "wood urgently required" can have separate actions: messages (Pushover, Telegram, mobile app and other notify actions), announcements on Amazon Echo devices and other actions. Every channel is optional and has its own delay. A channel only fires if the status still holds after its delay. By default only "wood urgently required" notifies, "wood required" can be switched on. Until the urgent actions are switched on, the actions for "wood required" are used. It also warns when the door is open too long or the chimney has too little draught. The language selects the default texts.</small>

    <small>**Français :** Vous rappelle quand le fire+ demande du bois. « Recharger du bois » et « Recharger du bois d'urgence » peuvent avoir des actions séparées : messages (Pushover, Telegram, application mobile et autres actions de notification), annonces sur les appareils Amazon Echo et autres actions. Chaque canal est facultatif et a son propre délai. Un canal ne se déclenche que si l'état persiste après son délai. Par défaut, seul « Recharger du bois d'urgence » notifie, « Recharger du bois » peut être activé. Tant que les actions d'urgence ne sont pas activées, les actions de « Recharger du bois » s'appliquent. Il avertit aussi lorsque la porte reste ouverte trop longtemps ou que la cheminée n'a pas assez de tirage. La langue détermine les textes par défaut.</small>

    Die Integration installiert und aktualisiert diese Datei. Wird sie geändert, bleibt die Änderung erhalten und es gibt keine Updates mehr.
    <small>The integration installs and updates this file. Once it is changed, the changes are kept and it is no longer updated.</small>
    <small>L'intégration installe et met à jour ce fichier. S'il est modifié, les modifications sont conservées et il n'est plus mis à jour.</small>
  domain: automation
  source_url: https://github.com/steigerbalett/ha-drooff-fireplus-v2/blob/v2.0.8b3/custom_components/drooff_fireplus_v2/blueprints/automation/wood_required_notification.yaml
  author: Drooff fire+ integration
  homeassistant:
    min_version: "2026.3.0"
  input:
    language:
      name: Sprache
      description: |-
        Sprache der Standardtexte.
        <small>**Language** – Language of the default texts.</small>
        <small>**Langue** – Langue des textes par défaut.</small>
      default: de
      selector:
        select:
          options:
            - label: Deutsch
              value: de
            - label: English
              value: en
            - label: Français
              value: fr
    status_sensor:
      name: Betriebsstatus
      description: |-
        Der Sensor "Betriebsstatus" des fire+. Leer = automatisch, wenn genau ein fire+ eingerichtet ist, bei mehreren hier wählen. Leere Sensorfelder weiter unten werden mit den Sensoren desselben fire+ belegt.
        <small>**Operation status** – The "Operation status" sensor of the fire+. Empty = automatic when exactly one fire+ is set up, with several choose it here. Empty sensor fields further down use the sensors of the same fire+.</small>
        <small>**État de fonctionnement** – Le capteur « État de fonctionnement » du fire+. Vide = automatique si un seul fire+ est configuré, s'il y en a plusieurs, le choisir ici. Les champs de capteur vides plus bas utilisent les capteurs du même fire+.</small>
      default: ""
      selector:
        entity:
          filter:
            - integration: drooff_fireplus_v2
              domain: sensor
    wood_load_sensor:
      name: Empfohlene Holzauflage
      description: |-
        Die Holzauflage wird an die Nachricht angehängt, standardmäßig als Anzahl der Holzscheite. Leer = der Sensor "Empfohlene Holzauflage" des fire+.
        <small>**Recommended wood load** – The wood load is appended to the message, by default as the number of logs. Empty = the "Recommended wood load" sensor of the fire+.</small>
        <small>**Charge de bois recommandée** – La charge de bois est ajoutée au message, par défaut en nombre de bûches. Vide = le capteur « Charge de bois recommandée » du fire+.</small>
      default: ""
      selector:
        entity:
          filter:
            - integration: drooff_fireplus_v2
              domain: sensor
    wood_load_unit:
      name: Holzauflage angeben als
      description: |-
        Die Anzahl der Holzscheite ergibt sich aus der empfohlenen Menge in kg und dem Gewicht je Holzscheit, mindestens 1. Nicht angeben = keine Holzauflage in der Nachricht.
        <small>**Show wood load as** – The number of logs follows from the recommended amount in kg and the weight per log, at least 1. Do not show = no wood load in the message.</small>
        <small>**Afficher la charge de bois en** – Le nombre de bûches découle de la quantité recommandée en kg et du poids par bûche, au moins 1. Ne pas afficher = pas de charge de bois dans le message.</small>
      default: logs
      selector:
        select:
          options:
            - label: Holzscheite / Logs / Bûches
              value: logs
            - label: kg
              value: kg
            - label: Holzscheite und kg / Logs and kg / Bûches et kg
              value: both
            - label: Nicht angeben / Do not show / Ne pas afficher
              value: none
    log_weight:
      name: Gewicht je Holzscheit
      description: |-
        Durchschnittliches Gewicht eines deiner Holzscheite. Drooff nennt in den technischen Informationen z. B. 1,4 kg in 2 Holzscheiten, also etwa 0,7 kg je Scheit. Am genauesten ist es, ein paar eigene Scheite zu wiegen.
        <small>**Weight per log** – Average weight of one of your logs. Drooff's technical information gives e.g. 1.4 kg in 2 logs, about 0.7 kg per log. Weighing a few of your own logs is most accurate.</small>
        <small>**Poids par bûche** – Poids moyen d'une de vos bûches. Les informations techniques de Drooff indiquent par ex. 1,4 kg en 2 bûches, soit environ 0,7 kg par bûche. Le plus précis est de peser quelques-unes de vos bûches.</small>
      default: 0.7
      selector:
        number:
          min: 0.2
          max: 3
          step: 0.1
          unit_of_measurement: kg
          mode: box
    section:
      name: Aktion bei Holz nachlegen
      icon: mdi:fireplace
      description: |-
        Was passiert bei "Holz nachlegen". Diese Aktionen gelten auch für "Dringend", solange dort keine eigenen eingeschaltet sind.<br>
        <small>**Action when wood is required** – What happens when the fire+ asks for wood. These actions are also used when urgent, until own urgent actions are switched on.</small><br>
        <small>**Action quand il faut recharger du bois** – Ce qui se passe quand le fire+ demande du bois. Ces actions servent aussi en cas d'urgence, tant qu'aucune action propre à l'urgence n'est activée.</small>
      collapsed: true
      input:
        required_enabled:
          name: 'Bei "Holz nachlegen" melden'
          description: |-
            Aus = nur "Dringend Holz nachlegen" meldet sich.
            <small>**Notify when wood is required** – Off = only "wood urgently required" notifies.</small>
            <small>**Notifier pour « Recharger du bois »** – Désactivé = seul « Recharger du bois d'urgence » notifie.</small>
          default: false
          selector:
            boolean:
        title:
          name: Titel
          description: |-
            Leer = Standardtext der gewählten Sprache. Nicht für Echo-Ansagen.
            <small>**Title** – Empty = default text of the selected language. Not used for Echo announcements.</small>
            <small>**Titre** – Vide = texte par défaut de la langue choisie. Non utilisé pour les annonces Echo.</small>
          default: ""
          selector:
            text:
        message:
          name: Nachricht
          description: |-
            Leer = Standardtext der gewählten Sprache.
            <small>**Message** – Empty = default text of the selected language.</small>
            <small>**Message** – Vide = texte par défaut de la langue choisie.</small>
          default: ""
          selector:
            text:
              multiline: true
        notify_actions:
          name: "Nachricht: Aktionen"
          description: |-
            Vorbelegt sind zwei Aktionen: eine Benachrichtigung in Home Assistant (eingeschaltet) und Pushover (notify.pushover, ausgeschaltet). Pushover einschalten: im Menü der Aktion "Aktivieren" wählen, Priorität und Ton stehen unter data. Ohne Nachricht, z. B. nur mit Echo: beide Aktionen ausschalten oder löschen. Weitere Dienste wie notify.mobile_app_… lassen sich ergänzen, title "{{ title }}" und message "{{ text }}" enthalten Titel und Nachricht.
            <small>**Message: actions** – Preset are a Home Assistant notification (on) and Pushover (notify.pushover, off). Turn Pushover on with "Enable" in the menu of the action, priority and sound are under data. Without a message, e.g. Echo only: turn off or delete both actions. Other services such as notify.mobile_app_… can be added, title "{{ title }}" and message "{{ text }}" hold title and message.</small>
            <small>**Message : actions** – Deux actions sont prédéfinies : une notification Home Assistant (activée) et Pushover (notify.pushover, désactivée). Pour activer Pushover, choisir « Activer » dans le menu de l'action, la priorité et le son se trouvent sous data. Sans message, par ex. Echo seul : désactiver ou supprimer les deux actions. D'autres services comme notify.mobile_app_… peuvent être ajoutés, title "{{ title }}" et message "{{ text }}" contiennent le titre et le message.</small>
          default:
            - action: notify.persistent_notification
              data:
                title: "{{ title }}"
                message: "{{ text }}"
            - action: notify.pushover
              enabled: false
              continue_on_error: true
              data:
                title: "{{ title }}"
                message: "{{ text }}"
                data:
                  priority: 0
                  sound: pushover
          selector:
            action: {}
        notify_delay:
          name: "Nachricht: Verzögerung"
          description: |-
            <small>Message: delay · Message : délai</small>
          default:
            minutes: 0
          selector:
            duration:
        alexa_media_players:
          name: "Echo: Geräte (Alexa Media Player)"
          description: |-
            <small>Echo: devices · Echo : appareils</small>
          default: []
          selector:
            entity:
              filter:
                - integration: alexa_media
                  domain: media_player
              multiple: true
        alexa_media_type:
          name: "Echo: Art (Alexa Media Player)"
          description: |-
            Ansage mit Gong oder nur TTS.
            <small>**Echo: type** – Announcement with chime or TTS only.</small>
            <small>**Echo : type** – Annonce avec carillon ou TTS seul.</small>
          default: announce
          selector:
            select:
              options:
                - label: Ansage / Announce / Annonce
                  value: announce
                - label: TTS
                  value: tts
        alexa_notify_entities:
          name: "Echo: Notify-Entitäten (Alexa Devices)"
          description: |-
            z. B. notify.kitchen_announce, notify.kitchen_speak
            <small>Echo: notify entities · Echo : entités de notification</small>
          default: []
          selector:
            entity:
              filter:
                - integration: alexa_devices
                  domain: notify
              multiple: true
        echo_message:
          name: "Echo: Ansagetext"
          description: |-
            Leer = Nachricht.
            <small>**Echo: announcement** – Empty = message.</small>
            <small>**Echo : texte de l'annonce** – Vide = message.</small>
          default: ""
          selector:
            text:
        echo_delay:
          name: "Echo: Verzögerung"
          description: |-
            <small>Echo: delay · Echo : délai</small>
          default:
            minutes: 0
          selector:
            duration:
        custom_actions:
          name: Weitere Aktionen
          description: |-
            Beliebige Aktionen, die Variablen "title" und "text" enthalten Titel und Nachricht.
            <small>**Other actions** – Any actions, the variables "title" and "text" hold title and message.</small>
            <small>**Autres actions** – Actions au choix, les variables « title » et « text » contiennent le titre et le message.</small>
          default: []
          selector:
            action:
        custom_delay:
          name: "Weitere Aktionen: Verzögerung"
          description: |-
            <small>Other actions: delay · Autres actions : délai</small>
          default:
            minutes: 0
          selector:
            duration:
    urgent_section:
      name: Aktion bei Dringend Holz nachlegen
      icon: mdi:fire-alert
      description: |-
        Was passiert bei "Dringend Holz nachlegen".<br>
        <small>**Action when wood is urgently required** – What happens when the fire+ urgently asks for wood.</small><br>
        <small>**Action quand il faut recharger du bois d'urgence** – Ce qui se passe quand le fire+ demande du bois d'urgence.</small>
      collapsed: false
      input:
        urgent_enabled:
          name: 'Eigene Aktionen bei "Dringend" verwenden'
          description: |-
            Aus = es gelten die Aktionen für "Holz nachlegen".
            <small>**Use own actions when urgent** – Off = the actions for "wood required" are used.</small>
            <small>**Actions propres en cas d'urgence** – Désactivé = les actions de « Recharger du bois » s'appliquent.</small>
          default: false
          selector:
            boolean:
        urgent_title:
          name: Titel
          description: |-
            Leer = Standardtext der gewählten Sprache. Nicht für Echo-Ansagen.
            <small>**Title** – Empty = default text of the selected language. Not used for Echo announcements.</small>
            <small>**Titre** – Vide = texte par défaut de la langue choisie. Non utilisé pour les annonces Echo.</small>
          default: ""
          selector:
            text:
        urgent_message:
          name: Nachricht
          description: |-
            Leer = Standardtext der gewählten Sprache.
            <small>**Message** – Empty = default text of the selected language.</small>
            <small>**Message** – Vide = texte par défaut de la langue choisie.</small>
          default: ""
          selector:
            text:
              multiline: true
        urgent_notify_actions:
          name: "Nachricht: Aktionen"
          description: |-
            Vorbelegt sind zwei Aktionen: eine Benachrichtigung in Home Assistant (eingeschaltet) und Pushover (notify.pushover, ausgeschaltet). Pushover einschalten: im Menü der Aktion "Aktivieren" wählen, Priorität und Ton stehen unter data. Ohne Nachricht, z. B. nur mit Echo: beide Aktionen ausschalten oder löschen. Weitere Dienste wie notify.mobile_app_… lassen sich ergänzen, title "{{ title }}" und message "{{ text }}" enthalten Titel und Nachricht.
            <small>**Message: actions** – Preset are a Home Assistant notification (on) and Pushover (notify.pushover, off). Turn Pushover on with "Enable" in the menu of the action, priority and sound are under data. Without a message, e.g. Echo only: turn off or delete both actions. Other services such as notify.mobile_app_… can be added, title "{{ title }}" and message "{{ text }}" hold title and message.</small>
            <small>**Message : actions** – Deux actions sont prédéfinies : une notification Home Assistant (activée) et Pushover (notify.pushover, désactivée). Pour activer Pushover, choisir « Activer » dans le menu de l'action, la priorité et le son se trouvent sous data. Sans message, par ex. Echo seul : désactiver ou supprimer les deux actions. D'autres services comme notify.mobile_app_… peuvent être ajoutés, title "{{ title }}" et message "{{ text }}" contiennent le titre et le message.</small>
          default:
            - action: notify.persistent_notification
              data:
                title: "{{ title }}"
                message: "{{ text }}"
            - action: notify.pushover
              enabled: false
              continue_on_error: true
              data:
                title: "{{ title }}"
                message: "{{ text }}"
                data:
                  priority: 1
                  sound: siren
          selector:
            action: {}
        urgent_notify_delay:
          name: "Nachricht: Verzögerung"
          description: |-
            <small>Message: delay · Message : délai</small>
          default:
            minutes: 0
          selector:
            duration:
        urgent_alexa_media_players:
          name: "Echo: Geräte (Alexa Media Player)"
          description: |-
            <small>Echo: devices · Echo : appareils</small>
          default: []
          selector:
            entity:
              filter:
                - integration: alexa_media
                  domain: media_player
              multiple: true
        urgent_alexa_media_type:
          name: "Echo: Art (Alexa Media Player)"
          description: |-
            Ansage mit Gong oder nur TTS.
            <small>**Echo: type** – Announcement with chime or TTS only.</small>
            <small>**Echo : type** – Annonce avec carillon ou TTS seul.</small>
          default: announce
          selector:
            select:
              options:
                - label: Ansage / Announce / Annonce
                  value: announce
                - label: TTS
                  value: tts
        urgent_alexa_notify_entities:
          name: "Echo: Notify-Entitäten (Alexa Devices)"
          description: |-
            z. B. notify.kitchen_announce, notify.kitchen_speak
            <small>Echo: notify entities · Echo : entités de notification</small>
          default: []
          selector:
            entity:
              filter:
                - integration: alexa_devices
                  domain: notify
              multiple: true
        urgent_echo_message:
          name: "Echo: Ansagetext"
          description: |-
            Leer = Nachricht.
            <small>**Echo: announcement** – Empty = message.</small>
            <small>**Echo : texte de l'annonce** – Vide = message.</small>
          default: ""
          selector:
            text:
        urgent_echo_delay:
          name: "Echo: Verzögerung"
          description: |-
            <small>Echo: delay · Echo : délai</small>
          default:
            minutes: 0
          selector:
            duration:
        urgent_custom_actions:
          name: Weitere Aktionen
          description: |-
            Beliebige Aktionen, die Variablen "title" und "text" enthalten Titel und Nachricht.
            <small>**Other actions** – Any actions, the variables "title" and "text" hold title and message.</small>
            <small>**Autres actions** – Actions au choix, les variables « title » et « text » contiennent le titre et le message.</small>
          default: []
          selector:
            action:
        urgent_custom_delay:
          name: "Weitere Aktionen: Verzögerung"
          description: |-
            <small>Other actions: delay · Autres actions : délai</small>
          default:
            minutes: 0
          selector:
            duration:

    warnings_section:
      name: Weitere Warnungen
      icon: mdi:alert
      description: |-
        Warnungen bei zu lange offener Tür und zu wenig Kaminzug. Sie verwenden die Aktionen von "Holz nachlegen" oder "Dringend", ohne Verzögerung. Beide sind eingeschaltet, jede lässt sich mit ihrem eigenen Schalter ausschalten.<br>
        <small>**Other warnings** – Warnings when the door is open too long and when the chimney has too little draught. They use the actions of "wood required" or "urgent", without delay. Both are on, each can be switched off with its own switch.</small><br>
        <small>**Autres avertissements** – Avertissements lorsque la porte reste ouverte trop longtemps et lorsque la cheminée n'a pas assez de tirage. Ils utilisent les actions de « Recharger du bois » ou de l'urgence, sans délai. Les deux sont activés, chacun peut être désactivé avec son propre interrupteur.</small>
      collapsed: true
      input:
        door_enabled:
          name: Bei zu lange offener Tür warnen
          description: |-
            Der fire+ meldet das, wenn die Tür bei über 40 °C länger als 5 Minuten offen ist.
            <small>**Warn when the door is open too long** – The fire+ reports it when the door is open for more than 5 minutes above 40 °C.</small>
            <small>**Avertir si la porte reste ouverte trop longtemps** – Le fire+ le signale lorsque la porte est ouverte plus de 5 minutes au-dessus de 40 °C.</small>
          default: true
          selector:
            boolean:
        door_sensor:
          name: Tür zu lange offen
          description: |-
            Der Sensor "Tür zu lange offen" des fire+. Leer = automatisch.
            <small>**Door open too long** – The "Door open too long" sensor of the fire+. Empty = automatic.</small>
            <small>**Porte ouverte trop longtemps** – Le capteur « Porte ouverte trop longtemps » du fire+. Vide = automatique.</small>
          default: ""
          selector:
            entity:
              filter:
                - integration: drooff_fireplus_v2
                  domain: binary_sensor
                  device_class: problem
        door_message:
          name: "Tür: Nachricht"
          description: |-
            Leer = Standardtext der gewählten Sprache.
            <small>**Door: message** – Empty = default text of the selected language.</small>
            <small>**Porte : message** – Vide = texte par défaut de la langue choisie.</small>
          default: ""
          selector:
            text:
        draught_enabled:
          name: Bei zu wenig Kaminzug warnen
          description: |-
            Gewarnt wird bei den Fehlermeldungen "Kaminzug zu gering" und "Kein Kaminzug".
            <small>**Warn when the chimney draught is too low** – It warns at the error messages "Chimney draught too low" and "No chimney draught".</small>
            <small>**Avertir si le tirage est trop faible** – Il avertit en cas des messages d'erreur « Tirage de la cheminée trop faible » et « Pas de tirage de la cheminée ».</small>
          default: true
          selector:
            boolean:
        draught_sensor:
          name: Fehlermeldung
          description: |-
            Der Sensor "Fehlermeldung" des fire+. Leer = automatisch.
            <small>**Error message** – The "Error message" sensor of the fire+. Empty = automatic.</small>
            <small>**Message d'erreur** – Le capteur « Message d'erreur » du fire+. Vide = automatique.</small>
          default: ""
          selector:
            entity:
              filter:
                - integration: drooff_fireplus_v2
                  domain: sensor
                  device_class: enum
        draught_message:
          name: "Kaminzug: Nachricht"
          description: |-
            Leer = Standardtext der gewählten Sprache.
            <small>**Draught: message** – Empty = default text of the selected language.</small>
            <small>**Tirage : message** – Vide = texte par défaut de la langue choisie.</small>
          default: ""
          selector:
            text:
        warning_channels:
          name: Aktionen der Warnungen
          description: |-
            Welche Aktionen die Warnungen auslösen. "Dringend" gilt nur, wenn dort eigene Aktionen eingeschaltet sind, sonst die von "Holz nachlegen".
            <small>**Actions of the warnings** – Which actions the warnings run. "Urgent" only applies when own urgent actions are switched on, otherwise those of "wood required".</small>
            <small>**Actions des avertissements** – Les actions déclenchées par les avertissements. « Urgence » ne s'applique que si des actions propres à l'urgence sont activées, sinon celles de « Recharger du bois ».</small>
          default: urgent
          selector:
            select:
              options:
                - label: Holz nachlegen / Wood required / Recharger du bois
                  value: required
                - label: Dringend / Urgent / Urgence
                  value: urgent

mode: restart

# Empty sensor inputs are found automatically. Trigger variables can not read
# states, so each template trigger finds the operation status sensor itself:
# the only sensor of the integration with the status "wood_urgently_required".
# The other sensors belong to the same device.
trigger_variables:
  status_sensor: !input status_sensor
  door_enabled: !input door_enabled
  door_sensor: !input door_sensor
  draught_enabled: !input draught_enabled
  draught_sensor: !input draught_sensor

triggers:
  - trigger: template
    value_template: >-
      {%- set found = namespace(entities=[]) -%}
      {%- for e in integration_entities('drooff_fireplus_v2') if e.startswith('sensor.') and 'wood_urgently_required' in (state_attr(e, 'options') or []) -%}
      {%- set found.entities = found.entities + [e] -%}
      {%- endfor -%}
      {%- set s = status_sensor if status_sensor else (found.entities | first if found.entities | length == 1 else '') -%}
      {{ is_state(s, 'wood_required') }}
    id: required
  - trigger: template
    value_template: >-
      {%- set found = namespace(entities=[]) -%}
      {%- for e in integration_entities('drooff_fireplus_v2') if e.startswith('sensor.') and 'wood_urgently_required' in (state_attr(e, 'options') or []) -%}
      {%- set found.entities = found.entities + [e] -%}
      {%- endfor -%}
      {%- set s = status_sensor if status_sensor else (found.entities | first if found.entities | length == 1 else '') -%}
      {{ is_state(s, 'wood_urgently_required') }}
    id: urgent
  # A new run cancels the pending reminders, so nothing is sent once wood was added
  - trigger: template
    value_template: >-
      {%- set found = namespace(entities=[]) -%}
      {%- for e in integration_entities('drooff_fireplus_v2') if e.startswith('sensor.') and 'wood_urgently_required' in (state_attr(e, 'options') or []) -%}
      {%- set found.entities = found.entities + [e] -%}
      {%- endfor -%}
      {%- set s = status_sensor if status_sensor else (found.entities | first if found.entities | length == 1 else '') -%}
      {{ s != '' and states(s) not in ['wood_required', 'wood_urgently_required'] }}
    id: done
  - trigger: template
    value_template: >-
      {%- set found = namespace(entities=[], door='') -%}
      {%- for e in integration_entities('drooff_fireplus_v2') if door_enabled and not door_sensor and e.startswith('sensor.') and 'wood_urgently_required' in (state_attr(e, 'options') or []) -%}
      {%- set found.entities = found.entities + [e] -%}
      {%- endfor -%}
      {%- set s = status_sensor if status_sensor else (found.entities | first if found.entities | length == 1 else '') -%}
      {%- for e in (device_entities(device_id(s)) if s else []) if e.startswith('binary_sensor.') and states[e] and 'open_since' in states[e].attributes -%}
      {%- set found.door = e -%}
      {%- endfor -%}
      {%- set door = door_sensor if door_sensor else found.door -%}
      {{ door_enabled and door != '' and is_state(door, 'on') }}
    id: door
  - trigger: template
    value_template: >-
      {%- set found = namespace(entities=[], error='') -%}
      {%- for e in integration_entities('drooff_fireplus_v2') if draught_enabled and not draught_sensor and e.startswith('sensor.') and 'wood_urgently_required' in (state_attr(e, 'options') or []) -%}
      {%- set found.entities = found.entities + [e] -%}
      {%- endfor -%}
      {%- set s = status_sensor if status_sensor else (found.entities | first if found.entities | length == 1 else '') -%}
      {%- for e in (device_entities(device_id(s)) if s else []) if e.startswith('sensor.') and 'chimney_draught_too_low' in (state_attr(e, 'options') or []) -%}
      {%- set found.error = e -%}
      {%- endfor -%}
      {%- set error = draught_sensor if draught_sensor else found.error -%}
      {{ draught_enabled and error != '' and states(error) in ['chimney_draught_too_low', 'no_chimney_draught'] }}
    id: draught

variables:
  language: !input language
  wood_load_sensor: !input wood_load_sensor
  wood_load_unit: !input wood_load_unit
  log_weight: !input log_weight
  required_enabled: !input required_enabled
  urgent_enabled: !input urgent_enabled
  door_message: !input door_message
  draught_message: !input draught_message
  warning_channels: !input warning_channels
  sensor: >-
    {%- set found = namespace(entities=[]) -%}
    {%- for e in integration_entities('drooff_fireplus_v2') if e.startswith('sensor.') and 'wood_urgently_required' in (state_attr(e, 'options') or []) -%}
    {%- set found.entities = found.entities + [e] -%}
    {%- endfor -%}
    {{ status_sensor if status_sensor else (found.entities | first if found.entities | length == 1 else '') }}
  fire_entities: "{{ device_entities(device_id(sensor)) if sensor else [] }}"
  wood_load_entity: >-
    {%- set found = namespace(entity='') -%}
    {%- for e in fire_entities if e.startswith('sensor.') and state_attr(e, 'device_class') == 'weight' and state_attr(e, 'state_class') is none -%}
    {%- set found.entity = e -%}
    {%- endfor -%}
    {{ wood_load_sensor if wood_load_sensor else found.entity }}
  draught_entity: >-
    {%- set found = namespace(entity='') -%}
    {%- for e in fire_entities if e.startswith('sensor.') and 'chimney_draught_too_low' in (state_attr(e, 'options') or []) -%}
    {%- set found.entity = e -%}
    {%- endfor -%}
    {{ draught_sensor if draught_sensor else found.entity }}
  defaults:
    de:
      title: Kaminofen
      required: Bitte Holz nachlegen.
      urgent: Dringend Holz nachlegen!
      one_log: Ein Holzscheit
      logs: Holzscheite
      door: Die Ofentür ist zu lange offen!
      draught: Der Schornstein hat zu wenig Zug!
      no_draught: Der Schornstein hat keinen Zug!
    en:
      title: Fireplace
      required: Please add wood.
      urgent: Add wood now!
      one_log: one log
      logs: logs
      door: The stove door has been open too long!
      draught: The chimney has too little draught!
      no_draught: The chimney has no draught!
    fr:
      title: Poêle
      required: Veuillez recharger du bois.
      urgent: Rechargez du bois maintenant !
      one_log: une bûche
      logs: bûches
      door: La porte du poêle est ouverte depuis trop longtemps !
      draught: La cheminée n'a pas assez de tirage !
      no_draught: La cheminée n'a pas de tirage !
  normal:
    title: !input title
    message: !input message
    notify_delay: !input notify_delay
    alexa_media_players: !input alexa_media_players
    alexa_media_type: !input alexa_media_type
    alexa_notify_entities: !input alexa_notify_entities
    echo_message: !input echo_message
    echo_delay: !input echo_delay
    custom_delay: !input custom_delay
  urgent:
    title: !input urgent_title
    message: !input urgent_message
    notify_delay: !input urgent_notify_delay
    alexa_media_players: !input urgent_alexa_media_players
    alexa_media_type: !input urgent_alexa_media_type
    alexa_notify_entities: !input urgent_alexa_notify_entities
    echo_message: !input urgent_echo_message
    echo_delay: !input urgent_echo_delay
    custom_delay: !input urgent_custom_delay

actions:
  # The status triggers also fire when another entity changed the result, e.g.
  # when the sensor came back after a restart, so they check what changed.
  # wood_urgently_required -> wood_required means wood was added, the fire+
  # passes through it on the way back to regular.
  - condition: template
    value_template: >-
      {%- set own = trigger.to_state is not none and trigger.to_state.entity_id == sensor -%}
      {%- set old = trigger.from_state.state if trigger.from_state is not none else 'unknown' -%}
      {%- if trigger.id == 'urgent' -%}
      {{ own and old not in ['unavailable', 'unknown'] }}
      {%- elif trigger.id == 'required' -%}
      {{ required_enabled and own and old not in ['unavailable', 'unknown', 'wood_urgently_required'] }}
      {%- else -%}
      {{ trigger.id in ['door', 'draught'] }}
      {%- endif -%}
  - variables:
      # door open too long and too little draught: no delay, no wood load
      is_warning: "{{ trigger.id in ['door', 'draught'] }}"
      use_urgent: >-
        {{ urgent_enabled and (trigger.id == 'urgent' or (is_warning and warning_channels == 'urgent')) }}
      c: "{{ urgent if use_urgent else normal }}"
      texts: "{{ defaults[language] if language in defaults else defaults.en }}"
      status: "{{ trigger.to_state.state if not is_warning else '' }}"
      title: "{{ c.title if c.title else texts.title }}"
      message: >-
        {%- if trigger.id == 'door' -%}
        {{ door_message if door_message else texts.door }}
        {%- elif trigger.id == 'draught' -%}
        {{ draught_message if draught_message
           else (texts.no_draught if is_state(draught_entity, 'no_chimney_draught') else texts.draught) }}
        {%- else -%}
        {{ c.message if c.message else texts[trigger.id] }}
        {%- endif -%}
      wood_load: >-
        {{ states(wood_load_entity) | float(0) if wood_load_entity and wood_load_unit != 'none' else 0 }}
      # number of logs from the amount in kg, at least one
      logs: >-
        {%- set weight = log_weight | float(0.7) -%}
        {%- set weight = weight if weight > 0 else 0.7 -%}
        {{ [(wood_load / weight) | round(0) | int, 1] | max }}
      load_text: >-
        {%- set kg = (wood_load | round(1)) ~ ' kg' -%}
        {%- set pieces = texts.one_log if logs == 1 else logs ~ ' ' ~ texts.logs -%}
        {%- if wood_load_unit == 'kg' -%}
        {{ kg }}
        {%- elif wood_load_unit == 'both' -%}
        {{ pieces }}, {{ kg }}
        {%- else -%}
        {{ pieces }}
        {%- endif -%}
      text: >-
        {%- if wood_load > 0 and not is_warning -%}
        {{ message }} ({{ load_text }})
        {%- else -%}
        {{ message }}
        {%- endif -%}
      echo_text: "{{ c.echo_message if c.echo_message and not is_warning else text }}"
      # Empty inputs may arrive as null, so lists and delays get a fallback
      media_players: "{{ c.alexa_media_players or [] }}"
      notify_entities: "{{ c.alexa_notify_entities or [] }}"
      no_delay:
        minutes: 0
  - parallel:
      # actions can not be stored in variables, so both lists are used directly
      - sequence:
          - delay: "{{ no_delay if is_warning else (c.notify_delay or no_delay) }}"
          - condition: template
            value_template: "{{ is_warning or states(sensor) == status }}"
          - if:
              - condition: template
                value_template: "{{ use_urgent }}"
            then: !input urgent_notify_actions
            else: !input notify_actions
      - sequence:
          - condition: template
            value_template: "{{ (media_players + notify_entities) | length > 0 }}"
          - delay: "{{ no_delay if is_warning else (c.echo_delay or no_delay) }}"
          - condition: template
            value_template: "{{ is_warning or states(sensor) == status }}"
          - if:
              - condition: template
                value_template: "{{ media_players | length > 0 }}"
            then:
              - action: notify.alexa_media
                continue_on_error: true
                data:
                  target: "{{ media_players }}"
                  message: "{{ echo_text }}"
                  data:
                    type: "{{ c.alexa_media_type or 'announce' }}"
          - if:
              - condition: template
                value_template: "{{ notify_entities | length > 0 }}"
            then:
              - action: notify.send_message
                continue_on_error: true
                target:
                  entity_id: "{{ notify_entities }}"
                data:
                  message: "{{ echo_text }}"
      - sequence:
          - delay: "{{ no_delay if is_warning else (c.custom_delay or no_delay) }}"
          - condition: template
            value_template: "{{ is_warning or states(sensor) == status }}"
          - if:
              - condition: template
                value_template: "{{ use_urgent }}"
            then: !input urgent_custom_actions
            else: !input custom_actions
