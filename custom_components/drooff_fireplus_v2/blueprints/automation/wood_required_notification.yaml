blueprint:
  name: "Drooff fire+: Holz nachlegen / Add wood"
  description: >-
    **Deutsch:** Erinnert, wenn der fire+ nach Holz verlangt. Für "Holz
    nachlegen" und "Dringend Holz nachlegen" lassen sich getrennte Aktionen
    einstellen: Nachrichten (Pushover, Telegram, Handy-App und andere
    Notify-Aktionen), Ansagen auf Amazon-Echo-Geräten und weitere Aktionen.
    Alle Kanäle sind optional und haben eine eigene Verzögerung. Ein Kanal
    meldet sich nur, wenn der Zustand nach der Verzögerung noch besteht.
    Solange die Aktionen für "Dringend" nicht eingeschaltet sind, gelten dort
    die Aktionen für "Holz nachlegen". Die Sprache bestimmt die Standardtexte.


    **English:** Reminds you when the fire+ asks for wood. "Wood required" and
    "wood urgently required" can have separate actions: messages (Pushover,
    Telegram, mobile app and other notify actions), announcements on Amazon
    Echo devices and other actions. Every channel is optional and has its own
    delay. A channel only fires if the status still holds after its delay.
    Until the urgent actions are switched on, the actions for "wood required"
    are used. The language selects the default texts.


    Die Integration installiert und aktualisiert diese Datei. Wird sie
    geändert, bleibt die Änderung erhalten und es gibt keine Updates mehr.
    / The integration installs and updates this file. Once it is changed, the
    changes are kept and it is no longer updated.
  domain: automation
  source_url: https://github.com/steigerbalett/ha-drooff-fireplus-v2/blob/v2.0.5b2/custom_components/drooff_fireplus_v2/blueprints/automation/wood_required_notification.yaml
  author: Drooff fire+ integration
  homeassistant:
    min_version: "2026.3.0"
  input:
    language:
      name: Sprache / Language
      description: Sprache der Standardtexte. / Language of the default texts.
      default: de
      selector:
        select:
          options:
            - label: Deutsch
              value: de
            - label: English
              value: en
    status_sensor:
      name: Betriebsstatus / Operation status
      description: Der Sensor "Betriebsstatus" des fire+. / The "Operation status" sensor of the fire+.
      selector:
        entity:
          filter:
            - integration: drooff_fireplus_v2
              domain: sensor
    wood_load_sensor:
      name: Empfohlene Holzauflage / Recommended wood load (optional)
      description: >-
        Wenn gesetzt, wird die Holzauflage an die Nachricht angehängt,
        standardmäßig als Anzahl der Holzscheite.
        / If set, the wood load is appended to the message, by default as the
        number of logs.
      default: ""
      selector:
        entity:
          filter:
            - integration: drooff_fireplus_v2
              domain: sensor
    wood_load_unit:
      name: Holzauflage angeben als / Show wood load as
      description: >-
        Die Anzahl der Holzscheite ergibt sich aus der empfohlenen Menge in kg
        und dem Gewicht je Holzscheit, mindestens 1.
        / The number of logs follows from the recommended amount in kg and the
        weight per log, at least 1.
      default: logs
      selector:
        select:
          options:
            - label: Holzscheite / Logs
              value: logs
            - label: kg
              value: kg
            - label: Holzscheite und kg / Logs and kg
              value: both
    log_weight:
      name: Gewicht je Holzscheit / Weight per log
      description: >-
        Durchschnittliches Gewicht eines deiner Holzscheite. Drooff nennt in
        den technischen Informationen z. B. 1,4 kg in 2 Holzscheiten, also
        etwa 0,7 kg je Scheit. Am genauesten ist es, ein paar eigene Scheite zu
        wiegen.
        / Average weight of one of your logs. Drooff's technical information
        gives e.g. 1.4 kg in 2 logs, about 0.7 kg per log. Weighing a few of
        your own logs is most accurate.
      default: 0.7
      selector:
        number:
          min: 0.2
          max: 3
          step: 0.1
          unit_of_measurement: kg
          mode: box
    section:
      name: Aktion bei Holz nachlegen / Action when wood is required
      icon: mdi:fireplace
      description: >-
        Was passiert bei "Holz nachlegen". / What happens when the fire+ asks for wood.
      collapsed: false
      input:
        title:
          name: Titel / Title
          description: >-
            Leer = Standardtext der gewählten Sprache. Nicht für Echo-Ansagen.
            / Empty = default text of the selected language. Not used for Echo announcements.
          default: ""
          selector:
            text:
        message:
          name: Nachricht / Message
          description: Leer = Standardtext der gewählten Sprache. / Empty = default text of the selected language.
          default: ""
          selector:
            text:
              multiline: true
        notify_actions:
          name: "Nachricht: Aktionen / Message: actions"
          description: >-
            Vorbelegt sind zwei Aktionen: eine Benachrichtigung in Home Assistant
            (eingeschaltet) und Pushover (notify.pushover, ausgeschaltet).
            Pushover einschalten: im Menü der Aktion "Aktivieren" wählen, Priorität
            und Ton stehen unter data. Ohne Nachricht, z. B. nur mit Echo: beide
            Aktionen ausschalten oder löschen. Weitere Dienste wie
            notify.mobile_app_… lassen sich ergänzen, title "{{ title }}" und
            message "{{ text }}" enthalten Titel und Nachricht.
            / Preset are a Home Assistant notification (on) and Pushover
            (notify.pushover, off). Turn Pushover on with "Enable" in the menu of
            the action, priority and sound are under data. Without a message, e.g.
            Echo only: turn off or delete both actions.
          default:
            - action: notify.persistent_notification
              data:
                title: "{{ title }}"
                message: "{{ text }}"
            - action: notify.pushover
              enabled: false
              continue_on_error: true
              data:
                title: "{{ title }}"
                message: "{{ text }}"
                data:
                  priority: 0
                  sound: pushover
          selector:
            action: {}
        notify_delay:
          name: "Nachricht: Verzögerung / Message: delay"
          default:
            minutes: 0
          selector:
            duration:
        alexa_media_players:
          name: "Echo: Geräte (Alexa Media Player) / devices (Alexa Media Player)"
          default: []
          selector:
            entity:
              filter:
                - integration: alexa_media
                  domain: media_player
              multiple: true
        alexa_media_type:
          name: "Echo: Art (Alexa Media Player) / type (Alexa Media Player)"
          description: Ansage mit Gong oder nur TTS. / Announcement with chime or TTS only.
          default: announce
          selector:
            select:
              options:
                - label: Ansage / Announce
                  value: announce
                - label: TTS
                  value: tts
        alexa_notify_entities:
          name: "Echo: Notify-Entitäten (Alexa Devices) / notify entities (Alexa Devices)"
          description: z. B. / e.g. notify.kitchen_announce, notify.kitchen_speak
          default: []
          selector:
            entity:
              filter:
                - integration: alexa_devices
                  domain: notify
              multiple: true
        echo_message:
          name: "Echo: Ansagetext / announcement"
          description: Leer = Nachricht. / Empty = message.
          default: ""
          selector:
            text:
        echo_delay:
          name: "Echo: Verzögerung / delay"
          default:
            minutes: 0
          selector:
            duration:
        custom_actions:
          name: Weitere Aktionen / Other actions
          description: >-
            Beliebige Aktionen, die Variablen "title" und "text" enthalten Titel und Nachricht.
            / Any actions, the variables "title" and "text" hold title and message.
          default: []
          selector:
            action:
        custom_delay:
          name: "Weitere Aktionen: Verzögerung / Other actions: delay"
          default:
            minutes: 0
          selector:
            duration:
    urgent_section:
      name: Aktion bei Dringend Holz nachlegen / Action when wood is urgently required
      icon: mdi:fire-alert
      description: >-
        Was passiert bei "Dringend Holz nachlegen". / What happens when the fire+ urgently asks for wood.
      collapsed: true
      input:
        urgent_enabled:
          name: Eigene Aktionen bei "Dringend" verwenden / Use own actions when urgent
          description: >-
            Aus = es gelten die Aktionen für "Holz nachlegen".
            / Off = the actions for "wood required" are used.
          default: false
          selector:
            boolean:
        urgent_title:
          name: Titel / Title
          description: >-
            Leer = Standardtext der gewählten Sprache. Nicht für Echo-Ansagen.
            / Empty = default text of the selected language. Not used for Echo announcements.
          default: ""
          selector:
            text:
        urgent_message:
          name: Nachricht / Message
          description: Leer = Standardtext der gewählten Sprache. / Empty = default text of the selected language.
          default: ""
          selector:
            text:
              multiline: true
        urgent_notify_actions:
          name: "Nachricht: Aktionen / Message: actions"
          description: >-
            Vorbelegt sind zwei Aktionen: eine Benachrichtigung in Home Assistant
            (eingeschaltet) und Pushover (notify.pushover, ausgeschaltet).
            Pushover einschalten: im Menü der Aktion "Aktivieren" wählen, Priorität
            und Ton stehen unter data. Ohne Nachricht, z. B. nur mit Echo: beide
            Aktionen ausschalten oder löschen. Weitere Dienste wie
            notify.mobile_app_… lassen sich ergänzen, title "{{ title }}" und
            message "{{ text }}" enthalten Titel und Nachricht.
            / Preset are a Home Assistant notification (on) and Pushover
            (notify.pushover, off). Turn Pushover on with "Enable" in the menu of
            the action, priority and sound are under data. Without a message, e.g.
            Echo only: turn off or delete both actions.
          default:
            - action: notify.persistent_notification
              data:
                title: "{{ title }}"
                message: "{{ text }}"
            - action: notify.pushover
              enabled: false
              continue_on_error: true
              data:
                title: "{{ title }}"
                message: "{{ text }}"
                data:
                  priority: 1
                  sound: siren
          selector:
            action: {}
        urgent_notify_delay:
          name: "Nachricht: Verzögerung / Message: delay"
          default:
            minutes: 0
          selector:
            duration:
        urgent_alexa_media_players:
          name: "Echo: Geräte (Alexa Media Player) / devices (Alexa Media Player)"
          default: []
          selector:
            entity:
              filter:
                - integration: alexa_media
                  domain: media_player
              multiple: true
        urgent_alexa_media_type:
          name: "Echo: Art (Alexa Media Player) / type (Alexa Media Player)"
          description: Ansage mit Gong oder nur TTS. / Announcement with chime or TTS only.
          default: announce
          selector:
            select:
              options:
                - label: Ansage / Announce
                  value: announce
                - label: TTS
                  value: tts
        urgent_alexa_notify_entities:
          name: "Echo: Notify-Entitäten (Alexa Devices) / notify entities (Alexa Devices)"
          description: z. B. / e.g. notify.kitchen_announce, notify.kitchen_speak
          default: []
          selector:
            entity:
              filter:
                - integration: alexa_devices
                  domain: notify
              multiple: true
        urgent_echo_message:
          name: "Echo: Ansagetext / announcement"
          description: Leer = Nachricht. / Empty = message.
          default: ""
          selector:
            text:
        urgent_echo_delay:
          name: "Echo: Verzögerung / delay"
          default:
            minutes: 0
          selector:
            duration:
        urgent_custom_actions:
          name: Weitere Aktionen / Other actions
          description: >-
            Beliebige Aktionen, die Variablen "title" und "text" enthalten Titel und Nachricht.
            / Any actions, the variables "title" and "text" hold title and message.
          default: []
          selector:
            action:
        urgent_custom_delay:
          name: "Weitere Aktionen: Verzögerung / Other actions: delay"
          default:
            minutes: 0
          selector:
            duration:

mode: restart

triggers:
  - trigger: state
    entity_id: !input status_sensor
    to: wood_required
    # wood_urgently_required -> wood_required means wood was added, the fire+
    # passes through it on the way back to regular
    not_from:
      - unavailable
      - unknown
      - wood_urgently_required
    id: required
  - trigger: state
    entity_id: !input status_sensor
    to: wood_urgently_required
    not_from:
      - unavailable
      - unknown
    id: urgent
  # A new run cancels the pending reminders, so nothing is sent once wood was added
  - trigger: state
    entity_id: !input status_sensor
    from:
      - wood_required
      - wood_urgently_required
    not_to:
      - wood_required
      - wood_urgently_required
    id: done
  - trigger: state
    entity_id: !input status_sensor
    from: wood_urgently_required
    to: wood_required
    id: done

variables:
  language: !input language
  sensor: !input status_sensor
  wood_load_sensor: !input wood_load_sensor
  wood_load_unit: !input wood_load_unit
  log_weight: !input log_weight
  urgent_enabled: !input urgent_enabled
  defaults:
    de:
      title: Kaminofen
      required: Bitte Holz nachlegen.
      urgent: Dringend Holz nachlegen!
      log: Holzscheit
      logs: Holzscheite
    en:
      title: Fireplace
      required: Please add wood.
      urgent: Add wood now!
      log: log
      logs: logs
  normal:
    title: !input title
    message: !input message
    notify_delay: !input notify_delay
    alexa_media_players: !input alexa_media_players
    alexa_media_type: !input alexa_media_type
    alexa_notify_entities: !input alexa_notify_entities
    echo_message: !input echo_message
    echo_delay: !input echo_delay
    custom_delay: !input custom_delay
  urgent:
    title: !input urgent_title
    message: !input urgent_message
    notify_delay: !input urgent_notify_delay
    alexa_media_players: !input urgent_alexa_media_players
    alexa_media_type: !input urgent_alexa_media_type
    alexa_notify_entities: !input urgent_alexa_notify_entities
    echo_message: !input urgent_echo_message
    echo_delay: !input urgent_echo_delay
    custom_delay: !input urgent_custom_delay

actions:
  - condition: template
    value_template: "{{ trigger.id in ['required', 'urgent'] }}"
  - variables:
      use_urgent: "{{ trigger.id == 'urgent' and urgent_enabled }}"
      c: "{{ urgent if use_urgent else normal }}"
      texts: "{{ defaults[language] if language in defaults else defaults.en }}"
      status: "{{ trigger.to_state.state }}"
      title: "{{ c.title if c.title else texts.title }}"
      message: "{{ c.message if c.message else texts[trigger.id] }}"
      wood_load: "{{ states(wood_load_sensor) | float(0) if wood_load_sensor else 0 }}"
      # number of logs from the amount in kg, at least one
      logs: >-
        {%- set weight = log_weight | float(0.7) -%}
        {%- set weight = weight if weight > 0 else 0.7 -%}
        {{ [(wood_load / weight) | round(0) | int, 1] | max }}
      load_text: >-
        {%- set kg = (wood_load | round(1)) ~ ' kg' -%}
        {%- set pieces = logs ~ ' ' ~ (texts.log if logs == 1 else texts.logs) -%}
        {%- if wood_load_unit == 'kg' -%}
        {{ kg }}
        {%- elif wood_load_unit == 'both' -%}
        {{ pieces }}, {{ kg }}
        {%- else -%}
        {{ pieces }}
        {%- endif -%}
      text: >-
        {%- if wood_load > 0 -%}
        {{ message }} ({{ load_text }})
        {%- else -%}
        {{ message }}
        {%- endif -%}
      echo_text: "{{ c.echo_message if c.echo_message else text }}"
      # Empty inputs may arrive as null, so lists and delays get a fallback
      media_players: "{{ c.alexa_media_players or [] }}"
      notify_entities: "{{ c.alexa_notify_entities or [] }}"
      no_delay:
        minutes: 0
  - parallel:
      # actions can not be stored in variables, so both lists are used directly
      - sequence:
          - delay: "{{ c.notify_delay or no_delay }}"
          - condition: template
            value_template: "{{ states(sensor) == status }}"
          - if:
              - condition: template
                value_template: "{{ use_urgent }}"
            then: !input urgent_notify_actions
            else: !input notify_actions
      - sequence:
          - condition: template
            value_template: "{{ (media_players + notify_entities) | length > 0 }}"
          - delay: "{{ c.echo_delay or no_delay }}"
          - condition: template
            value_template: "{{ states(sensor) == status }}"
          - if:
              - condition: template
                value_template: "{{ media_players | length > 0 }}"
            then:
              - action: notify.alexa_media
                continue_on_error: true
                data:
                  target: "{{ media_players }}"
                  message: "{{ echo_text }}"
                  data:
                    type: "{{ c.alexa_media_type or 'announce' }}"
          - if:
              - condition: template
                value_template: "{{ notify_entities | length > 0 }}"
            then:
              - action: notify.send_message
                continue_on_error: true
                target:
                  entity_id: "{{ notify_entities }}"
                data:
                  message: "{{ echo_text }}"
      - sequence:
          - delay: "{{ c.custom_delay or no_delay }}"
          - condition: template
            value_template: "{{ states(sensor) == status }}"
          - if:
              - condition: template
                value_template: "{{ use_urgent }}"
            then: !input urgent_custom_actions
            else: !input custom_actions
